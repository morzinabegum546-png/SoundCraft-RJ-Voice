
name: Inspect RJ Voice Build Script

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        shell: pwsh
        run: |
          Expand-Archive "soundcraft-main-rjvoice.zip" "project" -Force

      - name: Read Windows package script
        shell: pwsh
        run: |
          Get-Content "project/soundcraft-main/packaging/windows/package.ps1"

      - name: Read build instructions
        shell: pwsh
        run: |
          Get-Content "project/soundcraft-main/README.md" -TotalCount 150

      - name: Show Rust version requirements
        shell: pwsh
        run: |
          Get-Content "project/soundcraft-main/Cargo.toml" -TotalCount 120
