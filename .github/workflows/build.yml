
name: Inspect RJ Voice Build Instructions

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        shell: pwsh
        run: |
          Expand-Archive "soundcraft-main-rjvoice.zip" "project" -Force

      - name: Show Windows packaging script
        shell: pwsh
        run: |
          Get-Content "project/soundcraft-main/packaging/windows/package.ps1"

      - name: Show README instructions
        shell: pwsh
        run: |
          Get-Content "project/soundcraft-main/README.md" -TotalCount 150

      - name: Show Rust configuration
        shell: pwsh
        run: |
          Get-Content "project/soundcraft-main/Cargo.toml" -TotalCount 150
