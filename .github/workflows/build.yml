
name: Build SoundCraft RJ Voice for Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Extract SoundCraft project
        shell: pwsh
        run: |
          Expand-Archive "soundcraft-main-rjvoice.zip" "project" -Force

      - name: Install WiX 5
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build Windows application
        shell: pwsh
        working-directory: project/soundcraft-main
        run: |
          $env:SOUNDCRAFT_BUILD_SHA = "${{ github.sha }}"
          $env:SOUNDCRAFT_BUILD_DATE = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')
          .\packaging\windows\package.ps1 -Arch x64

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: SoundCraft-RJ-Voice-Windows-x64
          path: |
            project/soundcraft-main/dist/release/*.msi
            project/soundcraft-main/dist/release/*portable.zip
          if-no-files-found: error
